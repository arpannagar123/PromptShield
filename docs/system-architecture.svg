<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
<title id="title">System architecture</title><desc id="desc">PromptShield browser application calls a local Node server or Vercel API route, which reads protected environment keys and calls NVIDIA NIM or Groq.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52565c"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="50" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#5f6368">PROMPTSHIELD AI  /  MILESTONE 2</text>
<text x="48" y="98" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#202124">System architecture</text>
<line x1="48" y1="120" x2="1232" y2="120" stroke="#c8c8c8" stroke-width="1"/>
<text x="48" y="158" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6368" text-anchor="start">Provider credentials stay on the server side; the browser receives test results and builds the report.</text>
<rect x="48" y="205" width="350" height="340" rx="18" fill="#ffffff" stroke="#52565c" stroke-width="1.5"/><text x="72" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5f6368" text-anchor="start">BROWSER</text>
<rect x="72" y="265" width="302" height="130" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="90" y="296" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202124" text-anchor="start">HTML / CSS / JavaScript</text>
<text x="90" y="327" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Landing page and Safety Lab</text>
<text x="90" y="348" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Challenge templates and response fields</text>
<rect x="72" y="420" width="302" height="98" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="90" y="451" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#202124" text-anchor="start">Results and PDF export</text>
<text x="90" y="482" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Verdicts, summary, downloadable report</text>
<rect x="465" y="205" width="350" height="340" rx="18" fill="#ffffff" stroke="#52565c" stroke-width="1.5"/><text x="489" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5f6368" text-anchor="start">SERVER / API</text>
<rect x="489" y="265" width="302" height="130" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="507" y="296" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202124" text-anchor="start">API layer</text>
<text x="507" y="327" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Local: server.js</text>
<text x="507" y="348" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Vercel: api/[...route].js</text>
<rect x="489" y="420" width="302" height="98" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="507" y="451" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#202124" text-anchor="start">Environment secrets</text>
<text x="507" y="482" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">NVIDIA_API_KEY / GROQ_API_KEY</text>
<text x="507" y="503" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Never expose keys in browser code</text>
<rect x="882" y="205" width="350" height="340" rx="18" fill="#ffffff" stroke="#52565c" stroke-width="1.5"/><text x="906" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5f6368" text-anchor="start">HOSTED PROVIDERS</text>
<rect x="906" y="265" width="302" height="110" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="924" y="296" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202124" text-anchor="start">NVIDIA NIM</text>
<text x="924" y="327" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Challenge response and/or rubric judge</text>
<rect x="906" y="400" width="302" height="110" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="924" y="431" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202124" text-anchor="start">Groq API</text>
<text x="924" y="462" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Challenge response and/or rubric judge</text>
<line x1="398" y1="330" x2="455" y2="330" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><text x="426.5" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="middle">test/evaluation request</text>
<line x1="815" y1="330" x2="872" y2="330" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><text x="843.5" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="middle">HTTPS API call</text>
<line x1="872" y1="470" x2="815" y2="470" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><text x="843.5" y="452" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="middle">model response / judgment</text>
<line x1="455" y1="470" x2="398" y2="470" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><text x="426.5" y="452" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="middle">results</text>
<text x="640" y="594" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="middle">PromptShield tests the selected provider model; it does not attach to an independently hosted chatbot.</text>
<text x="640" y="620" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="middle">The selected model may also act as rubric judge; provider limits and model changes affect repeatability.</text>

</svg>
