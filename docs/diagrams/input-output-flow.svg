<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
<title id="title">Input-output flow</title><desc id="desc">PromptShield inputs include chatbot rules, provider and difficulty settings, and a test reply; outputs include per-test findings, summary, and PDF report.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52565c"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="50" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#5f6368">PROMPTSHIELD AI  /  MILESTONE 2</text>
<text x="48" y="98" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#202124">Input-output flow</text>
<line x1="48" y1="120" x2="1232" y2="120" stroke="#c8c8c8" stroke-width="1"/>
<text x="48" y="158" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6368" text-anchor="start">Inputs are kept distinct from findings so each result can be traced to a test.</text>
<text x="72" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5f6368" text-anchor="start">INPUTS</text>
<rect x="55" y="260" width="270" height="190" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="73" y="291" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202124" text-anchor="start">Test configuration</text>
<text x="73" y="322" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Chatbot rules</text>
<text x="73" y="343" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Provider and model</text>
<text x="73" y="364" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Easy / Intermediate / Advanced</text>
<rect x="55" y="484" width="270" height="118" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="73" y="515" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202124" text-anchor="start">Response to assess</text>
<text x="73" y="546" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">One AI-run reply or</text>
<text x="73" y="567" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">manually pasted chatbot reply</text>
<rect x="438" y="330" width="392" height="190" rx="14" fill="#eeeeee" stroke="#52565c" stroke-width="1.5"/><text x="456" y="361" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#202124" text-anchor="start">PromptShield processing</text>
<text x="456" y="392" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Select one synthetic challenge</text>
<text x="456" y="413" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Run with selected provider OR accept reply</text>
<text x="456" y="434" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">On explicit click, judge against rules</text>
<text x="456" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">and expected safe behavior</text>
<text x="930" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5f6368" text-anchor="start">OUTPUTS</text>
<rect x="900" y="260" width="320" height="145" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="918" y="291" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202124" text-anchor="start">Per-check finding</text>
<text x="918" y="322" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Pass / issue / review</text>
<text x="918" y="343" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Score, evidence, confidence</text>
<text x="918" y="364" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Analysis and recommendation</text>
<rect x="900" y="440" width="320" height="145" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="918" y="471" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202124" text-anchor="start">Run artifacts</text>
<text x="918" y="502" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Overall summary and breakdown</text>
<text x="918" y="523" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Downloadable PDF report</text>
<line x1="325" y1="355" x2="424" y2="387" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><text x="374.5" y="346" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="middle">rules + settings</text>
<line x1="325" y1="544" x2="424" y2="470" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><text x="374.5" y="535" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="middle">reply + test context</text>
<line x1="830" y1="382" x2="886" y2="335" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><line x1="830" y1="470" x2="886" y2="505" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><text x="640" y="635" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="middle">Provider output and evaluator judgments can vary; a person reviews ambiguous cases.</text>

</svg>
