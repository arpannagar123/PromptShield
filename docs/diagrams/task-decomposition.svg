<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
<title id="title">Task decomposition</title><desc id="desc">A decomposition of PromptShield into setup, challenge design, reply capture, rubric judgment, and report review tasks.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52565c"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="50" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#5f6368">PROMPTSHIELD AI  /  MILESTONE 2</text>
<text x="48" y="98" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#202124">Task decomposition</text>
<line x1="48" y1="120" x2="1232" y2="120" stroke="#c8c8c8" stroke-width="1"/>
<text x="48" y="158" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6368" text-anchor="start">The prototype divides the safety check into five small, reviewable tasks.</text>
<rect x="455" y="184" width="370" height="86" rx="14" fill="#eeeeee" stroke="#52565c" stroke-width="1.5"/><circle cx="482" cy="212" r="14" fill="#ffffff" stroke="#52565c" stroke-width="1.2"/><text x="482" y="217" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">0</text>
<text x="507" y="215" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#202124" text-anchor="start">PromptShield safety check</text>
<text x="473" y="246" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Input: chatbot rules and test settings</text>
<line x1="640" y1="270" x2="640" y2="310" stroke="#52565c" stroke-width="2"/><line x1="137" y1="310" x2="1117" y2="310" stroke="#52565c" stroke-width="2"/><line x1="151" y1="310" x2="151" y2="343" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="354" width="192" height="155" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><circle cx="82" cy="382" r="14" fill="#ffffff" stroke="#52565c" stroke-width="1.2"/><text x="82" y="387" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">1</text>
<text x="107" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#202124" text-anchor="start">1  Configure</text>
<text x="73" y="416" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Enter rules; choose provider,</text>
<text x="73" y="437" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">model, and difficulty</text>
<line x1="396" y1="310" x2="396" y2="343" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><rect x="300" y="354" width="192" height="155" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><circle cx="327" cy="382" r="14" fill="#ffffff" stroke="#52565c" stroke-width="1.2"/><text x="327" y="387" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">2</text>
<text x="352" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#202124" text-anchor="start">2  Design checks</text>
<text x="318" y="416" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Select challenge category;</text>
<text x="318" y="437" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">generate synthetic wording</text>
<line x1="641" y1="310" x2="641" y2="343" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><rect x="545" y="354" width="192" height="155" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><circle cx="572" cy="382" r="14" fill="#ffffff" stroke="#52565c" stroke-width="1.2"/><text x="572" y="387" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">3</text>
<text x="597" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#202124" text-anchor="start">3  Capture reply</text>
<text x="563" y="416" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Run one challenge or enter</text>
<text x="563" y="437" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">a reply from another chatbot</text>
<line x1="886" y1="310" x2="886" y2="343" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><rect x="790" y="354" width="192" height="155" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><circle cx="817" cy="382" r="14" fill="#ffffff" stroke="#52565c" stroke-width="1.2"/><text x="817" y="387" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">4</text>
<text x="842" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#202124" text-anchor="start">4  Judge reply</text>
<text x="808" y="416" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Compare complete reply with</text>
<text x="808" y="437" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">rules and expected behavior</text>
<line x1="1131" y1="310" x2="1131" y2="343" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><rect x="1035" y="354" width="192" height="155" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><circle cx="1062" cy="382" r="14" fill="#ffffff" stroke="#52565c" stroke-width="1.2"/><text x="1062" y="387" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#202124" text-anchor="middle">5</text>
<text x="1087" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#202124" text-anchor="start">5  Report &amp; review</text>
<text x="1053" y="416" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Show evidence and findings;</text>
<text x="1053" y="437" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">export PDF; human review</text>
<rect x="55" y="565" width="1172" height="58" rx="10" fill="#ffffff" stroke="#a0a0a0"/><text x="72" y="590" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#202124" text-anchor="start">Safety boundary:</text>
<text x="190" y="590" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">synthetic prompts, authorized systems, no secrets or real personal data.</text>
<text x="72" y="611" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Evaluation output is a heuristic aid, not a security certification.</text>

</svg>
