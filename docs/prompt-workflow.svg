<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
<title id="title">Prompt testing workflow</title><desc id="desc">Six-step PromptShield process from rules setup through challenge generation, one-at-a-time response capture, explicit evaluation, and human review.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52565c"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="50" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#5f6368">PROMPTSHIELD AI  /  MILESTONE 2</text>
<text x="48" y="98" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#202124">Prompt testing workflow</text>
<line x1="48" y1="120" x2="1232" y2="120" stroke="#c8c8c8" stroke-width="1"/>
<text x="48" y="158" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#5f6368" text-anchor="start">A single test is run at a time. Evaluation starts only when the user clicks Evaluate responses.</text>
<rect x="48" y="260" width="164" height="178" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="66" y="291" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#202124" text-anchor="start">1  Set up rules</text>
<text x="66" y="322" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Enter chatbot rules</text>
<text x="66" y="343" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Choose provider/model</text>
<line x1="212" y1="349" x2="240" y2="349" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><rect x="252" y="260" width="164" height="178" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="270" y="291" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#202124" text-anchor="start">2  Choose a stage</text>
<text x="270" y="322" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Easy, Intermediate,</text>
<text x="270" y="343" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">or Advanced</text>
<line x1="416" y1="349" x2="444" y2="349" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><rect x="456" y="260" width="164" height="178" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="474" y="291" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#202124" text-anchor="start">3  Generate tests</text>
<text x="474" y="322" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Synthetic challenges</text>
<text x="474" y="343" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">with expected behavior</text>
<line x1="620" y1="349" x2="648" y2="349" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="260" width="164" height="178" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="678" y="291" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#202124" text-anchor="start">4  Get a reply</text>
<text x="678" y="322" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Run one test with AI</text>
<text x="678" y="343" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">or paste a chatbot reply</text>
<line x1="824" y1="349" x2="852" y2="349" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><rect x="864" y="260" width="164" height="178" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="882" y="291" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#202124" text-anchor="start">5  Evaluate</text>
<text x="882" y="322" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Click Evaluate responses</text>
<text x="882" y="343" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">to judge answered checks</text>
<line x1="1028" y1="349" x2="1056" y2="349" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/><rect x="1068" y="260" width="164" height="178" rx="14" fill="#f4f4f4" stroke="#52565c" stroke-width="1.5"/><text x="1086" y="291" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#202124" text-anchor="start">6  Review report</text>
<text x="1086" y="322" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">Inspect verdicts, evidence,</text>
<text x="1086" y="343" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start">summary, and PDF</text>
<rect x="48" y="510" width="1184" height="78" rx="12" fill="#ffffff" stroke="#a0a0a0" stroke-dasharray="6 5"/><text x="70" y="542" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#202124" text-anchor="start">Human review</text>
<text x="70" y="569" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#5f6368" text-anchor="start">Check ambiguous findings against the supplied chatbot rules; revise instructions and retest where needed.</text>
<line x1="1150" y1="440" x2="1150" y2="505" stroke="#52565c" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
